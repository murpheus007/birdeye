# Development override for docker-compose
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    volumes:
      # Mount source directory for hot reload
      - ./backend:/app
      # Don't overwrite venv
      - /app/.venv
    environment:
      FLASK_ENV: development
    command: >
      .venv/bin/flask run
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"

  frontend:
    volumes:
      # Mount source for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_URL: http://localhost:5000/api
    command: npm run dev
    ports:
      - "5173:5173"  # Vite dev server port

  discord-bot:
    volumes:
      # Mount source directory for hot reload
      - ./discord-bot:/app
      # Don't overwrite venv
      - /app/.venv
    environment:
      PYTHONUNBUFFERED: 1

  postgres:
    # Useful for dev: uncomment to see all SQL queries
    # environment:
    #   POSTGRES_INITDB_ARGS: "-c log_statement=all"

  redis:
    # Keep Redis data in dev
    volumes:
      - redis_data:/data
