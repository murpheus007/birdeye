services:
  # Nginx-proxy deployment profile (shared external network, no host port publishing)
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: birdeye-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      birdeye-network:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: birdeye-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - birdeye-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Flask Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: birdeye-backend
    environment:
      FLASK_APP: app.py
      FLASK_ENV: ${FLASK_ENV:-production}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      JWT_SECRET: ${JWT_SECRET}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
    ports:
      - "${API_PORT:-5000}:${API_PORT:-5000}"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - birdeye-network
    command: >
      sh -c "(.venv/bin/alembic -c alembic.ini upgrade head || .venv/bin/alembic -c alembic.ini stamp head) &&
      .venv/bin/gunicorn -w 4 -b 0.0.0.0:${API_PORT} --timeout 120 app:app"
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    container_name: birdeye-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend/src:/app/src
      - ./.nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - birdeye-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Discord Bot
  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: birdeye-discord-bot
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_ENABLE_MESSAGE_CONTENT: "true"
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY}
      BIRDEYE_API_BASE_URL: ${BIRDEYE_API_BASE_URL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/1
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      BOT_PREFIX: ${BOT_PREFIX}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL}
    volumes:
      - ./discord-bot:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - birdeye-network
    restart: always

networks:
  birdeye-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
